databases:
  - name: shubh-gems-customizer-db
    # Upgraded off "free" -- Render auto-suspends (then, after a 14-day
    # grace period, permanently DELETES) free Postgres instances 30 days
    # after creation. "0.1c-256mb" is Render's current cheapest paid
    # compute tier (0.1 CPU / 256MB RAM). NOTE: editing this file alone
    # does not perform the upgrade -- Render still requires confirming a
    # payment method and clicking "Upgrade" on the suspended database in
    # the Dashboard (this repo has no Render credentials/API access).
    # This line just keeps the Blueprint's declared plan in sync with
    # whatever plan is actually chosen there, so a future Blueprint sync
    # doesn't try to revert it back to "free".
    plan: 0.1c-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: shubh-gems-customizer-app
    runtime: node
    # Upgraded off "free" -- Render's free web-service plan blocks all
    # outbound SMTP ports (25/465/587), which was silently breaking
    # every email this app sends (Gmail auth itself was always fine --
    # confirmed by the failure mode being a pure connection timeout, not
    # a rejected login). Paid plans don't have this restriction.
    plan: 0.5c-512mb
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shubh-gems-customizer-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.19.0
      # Set these manually in the Render dashboard after the app is
      # created in Dev Dashboard — see DEPLOYMENT.md.
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: write_products,read_products,read_themes,write_inventory,read_orders,write_metaobjects,write_metaobject_definitions,write_publications,write_customers,read_customers
      - key: SHOPIFY_APP_URL
        sync: false
      # Shared secret for GET /cron/cleanup — set this to any random
      # string, then use the SAME value in whatever free external
      # scheduler hits that URL daily. See DEPLOYMENT.md. Render doesn't
      # offer a free plan for its own Cron Job service type, so this
      # avoids that cost entirely for something this cheap to run.
      - key: CRON_SECRET
        generateValue: true
      # --- Astro Advice / gem-recommendation lead pipeline (merged in
      # from astro-lead-sync-app) — see MERGE_ASTRO_ADVICE.md for how to
      # obtain each of these.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: ASTRO_LEADS_SPREADSHEET_ID
        sync: false
