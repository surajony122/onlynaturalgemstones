databases:
  - name: shubh-gems-customizer-db
    # Upgraded off "free" -- Render auto-suspends (then, after a 14-day
    # grace period, permanently DELETES) free Postgres instances 30 days
    # after creation. "0.1c-256mb" is Render's current cheapest paid
    # compute tier (0.1 CPU / 256MB RAM). NOTE: editing this file alone
    # does not perform the upgrade -- Render still requires confirming a
    # payment method and clicking "Upgrade" on the suspended database in
    # the Dashboard (this repo has no Render credentials/API access).
    # This line just keeps the Blueprint's declared plan in sync with
    # whatever plan is actually chosen there, so a future Blueprint sync
    # doesn't try to revert it back to "free".
    plan: 0.1c-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: shubh-gems-customizer-app
    runtime: node
    # Upgraded off "free" -- Render's free web-service plan blocks all
    # outbound SMTP ports (25/465/587), which was silently breaking
    # every email this app sends (Gmail auth itself was always fine --
    # confirmed by the failure mode being a pure connection timeout, not
    # a rejected login). Paid plans don't have this restriction.
    plan: 0.5c-512mb
    # The "mkdir -p ... && npx puppeteer browsers install chrome" step is
    # required, not optional -- confirmed live via the actual build log:
    # it correctly downloaded chrome@148.0.7778.97 to
    # $PUPPETEER_CACHE_DIR/chrome/linux-148.0.7778.97/chrome-linux64/chrome
    # during THIS build. And yet the very next deploy's runtime still
    # failed with "Could not find Chrome" at that exact same path --
    # proving the file really was written correctly during build but did
    # NOT survive into the running container. Root cause (confirmed
    # against Render's own docs -- see
    # https://render.com/docs/native-runtimes -- and multiple people
    # hitting this identical failure, e.g.
    # https://community.render.com/t/puppeteer-fails-to-find-chromium-on-render/9920):
    # for Render's native Node runtime, ONLY `/opt/render/project/src`
    # (this app's own source/deploy directory) is guaranteed to carry
    # forward from the build phase into the running container -- anything
    # written outside it, including the old `/opt/render/.cache`, is
    # ephemeral build-container-only storage that gets thrown away before
    # the service actually starts. Fixed by pointing PUPPETEER_CACHE_DIR
    # (below) at a path INSIDE /opt/render/project/src instead, so the
    # exact same Chrome download that already works during build now
    # actually still exists when the service starts.
    buildCommand: npm install && mkdir -p $PUPPETEER_CACHE_DIR && npx puppeteer browsers install chrome && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shubh-gems-customizer-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.19.0
      # Puppeteer (invoice PDF generation, orderInvoice.server.js) --
      # MUST live under /opt/render/project/src (this app's own
      # source/deploy directory, the one path Render's native Node
      # runtime carries from build into the running container -- see
      # buildCommand's own comment above for how this was confirmed).
      # /opt/render/.cache (the previous value) sits outside that
      # directory and is build-phase-only storage on Render -- Chrome
      # downloaded there during build was confirmed gone by the time the
      # service actually started.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      # Set these manually in the Render dashboard after the app is
      # created in Dev Dashboard — see DEPLOYMENT.md.
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: write_products,read_products,read_themes,write_inventory,read_orders,write_metaobjects,write_metaobject_definitions,write_publications,write_customers,read_customers
      - key: SHOPIFY_APP_URL
        sync: false
      # Shared secret for every GET /cron/* route (cleanup, health-check,
      # wishlist-email, order-processing-catchup). cron.cleanup /
      # cron.health-check / cron.wishlist-email are still meant to be
      # hit from a free external scheduler (cron-job.org etc.) daily --
      # cheap enough that paying for a dedicated Render Cron Job isn't
      # worth it for those. order-processing-catchup is different: it
      # needs to run every 5 minutes, and now runs as a real Render Cron
      # Job below instead (per explicit request, now that Render Cron
      # Jobs bill per-minute with only a ~$1/mo minimum rather than a
      # larger fixed plan fee) -- that job's own CRON_SECRET env var
      # (set manually in the Dashboard) must be the SAME value as this
      # one.
      - key: CRON_SECRET
        generateValue: true
      # --- Astro Advice / gem-recommendation lead pipeline (merged in
      # from astro-lead-sync-app) — see MERGE_ASTRO_ADVICE.md for how to
      # obtain each of these.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: ASTRO_LEADS_SPREADSHEET_ID
        sync: false

  # Runs the "order processing" WhatsApp/email catch-up poll every 5
  # minutes (see cron.order-processing-catchup.jsx for why this exists
  # -- marking an order "in progress" often never fires the orders/
  # updated webhook at all, confirmed live on real orders). Shares the
  # main app's own Node runtime rather than a Docker image specifically
  # to avoid Docker CMD's shell-quoting/env-var-expansion pitfalls for
  # something this trivial -- the buildCommand skips `npm install`
  # entirely since the one-line script below uses only native Node
  # features (global fetch, process.env) with zero external
  # dependencies, keeping each run's billed time as small as possible.
  - type: cron
    name: order-processing-catchup-cron
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: echo "no dependencies needed -- see startCommand"
    # encodeURIComponent(...) around the secret is not optional -- it
    # contains "+" and "=" characters, which get corrupted (silently
    # interpreted as a space and a param delimiter) if concatenated
    # into the query string raw, causing a 401 on every single run
    # despite the "correct" secret being used. Confirmed by testing
    # this exact command locally before relying on Render to run it --
    # the raw-concatenation version failed with {"error":"Unauthorized"}
    # even with the right secret.
    #
    # Checking r.ok before deciding exitCode is NOT optional either --
    # found live that this job's very first real run hit a 401 (the
    # CRON_SECRET typed into THIS service's own env var didn't match
    # the web service's, a copy-paste mismatch) and Render's dashboard
    # still showed "Successful run", because fetch() only rejects on a
    # network-level failure, not an HTTP error status -- an early
    # version of this script logged the response and unconditionally
    # set exitCode = 0 regardless of what it actually said, making a
    # broken secret look identical to a working one at a glance.
    startCommand: >-
      node -e "fetch('https://shubh-gems-customizer-app.onrender.com/cron/order-processing-catchup?secret=' + encodeURIComponent(process.env.CRON_SECRET)).then(async r => { const t = await r.text(); console.log('HTTP', r.status, t); process.exitCode = r.ok ? 0 : 1; }).catch(e => { console.error(e); process.exitCode = 1; })"
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      # MUST be set to the exact same value as the web service's own
      # CRON_SECRET above (copy it from the web service's Environment
      # tab in the Dashboard) -- this job authenticates to that same
      # endpoint with it.
      - key: CRON_SECRET
        sync: false
