query CartTransformRunInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
          product {
            id
            handle
            title
          }
        }
      }
      attribute(key: "Linked Gemstone") {
        value
      }
      bundleId: attribute(key: "_bundle_id") {
        value
      }
      customizationType: attribute(key: "Type") {
        value
      }
    }
  }
}
