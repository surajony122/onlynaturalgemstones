# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "24a6c503d46ca4f07024783f33b4b23d"
name = "Shubh Gems varint options"
application_url = "https://shubh-gems-customizer-app.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_products: creates the priced customization variants (never used to
#   edit an existing product's own price — see app/utils/pricing.server.js)
# read_products: reads gemstone variant price, design metaobjects
# read_themes: reads config/settings_data.json for metal/cert rates
# write_inventory: lets the orders/create webhook decrement the real
#   gemstone's stock, since the real gemstone product never goes in the cart
# read_orders: required to receive the orders/create webhook
# write_publications: publishes the shared "Certification Upgrade" addon
#   product to the Online Store channel — an unpublished product's
#   variants get rejected by /cart/add.js, same reason as the gemstone
#   customization product
# write_customers, read_customers: merged in from astro-lead-sync-app —
#   lets proxy.astro-advice.jsx tag/note/metafield-sync gem-recommendation
#   leads as Customer records (see app/utils/astroAdvice.server.js). This
#   app now handles both jobs; astro-lead-sync-app's own client_id/secret
#   can be retired once this is confirmed working — see
#   MERGE_ASTRO_ADVICE.md.
scopes = "write_products,read_products,read_themes,write_inventory,read_orders,write_metaobjects,write_metaobject_definitions,write_publications,write_customers,read_customers"

# Lets the theme call https://<store-domain>/apps/customize , which Shopify
# signs and proxies to this app's /proxy route — see app/routes/proxy.jsx.
[app_proxy]
url = "https://shubh-gems-customizer-app.onrender.com/proxy"
subpath = "customize"
prefix = "apps"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

[auth]
redirect_urls = [ "https://shubh-gems-customizer-app.onrender.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
